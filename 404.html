<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 - 北京鼎熠科技有限公司</title>
  <meta name="robots" content="noindex">
  <!--
    404 页会在任意深度的缺失 URL 处被服务器渲染，
    因此本页完全自包含：样式内联、图标用 data URI、不引用任何相对路径资源。
    「返回首页」当前指向 GitHub Pages 项目站点根 /dykj-web/；
    将来迁移到正式域名根部署时，请改回 href="/"。
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5e5c'/%3E%3Ctext x='32' y='45' font-family='serif' font-size='38' font-weight='700' fill='%23fff' text-anchor='middle'%3E鼎%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑",
                   "Noto Sans CJK SC", sans-serif;
      line-height: 1.75;
    }
    .err-wrap {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 40px 24px; color: #fff;
      background: linear-gradient(160deg, #06201f, #0d3b39);
    }
    .err-wrap h1 { font-size: clamp(80px, 16vw, 150px); line-height: 1; color: #3db8b0; }
    .err-wrap p { margin: 18px 0 30px; color: rgba(234, 244, 243, .75); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 30px; border-radius: 999px; text-decoration: none;
      font-size: 15.5px; font-weight: 600; letter-spacing: .04em;
      background: #147d7a; color: #fff; box-shadow: 0 8px 22px rgba(20, 125, 122, .35);
      transition: transform .2s ease, background .2s ease;
    }
    .btn:hover { transform: translateY(-2px); background: #1b9e97; }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div>
      <h1>404</h1>
      <p>抱歉，您访问的页面不存在或已被移动。<br>真空里什么都没有 —— 这个页面也是。</p>
      <a class="btn" href="/dykj-web/">返回首页</a>
    </div>
  </div>
</body>
</html>
