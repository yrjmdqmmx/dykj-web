# 部署静态官网到 GitHub Pages
# Settings → Pages → Source 需设为 "GitHub Actions"（已设置）
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dingyi-tech-website-lkp7bu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node.js for browser QA
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test deploy artifact
        run: bash tests/build-site.test.sh
      - name: Test cinematic UI contracts
        run: |
          python3 -m unittest -v tests/home_ui_contract_test.py tests/build_ui_contract_test.py tests/map_contract_test.py tests/playwright_toolchain_contract_test.py
          node tests/company_scrolly_runtime_test.js
          node tests/main_menu_runtime_test.js
          node tests/map_runtime_test.js
      - name: Install browser QA dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser quality gates
        run: npm run test:browser
      - name: Build deploy artifact
        run: scripts/build-site.sh _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
